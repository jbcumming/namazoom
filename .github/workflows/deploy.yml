# Build the data and the site, then publish to GitHub Pages.
# Runs daily (new preliminary quakes and a new 7-day forecast), on pushes to the
# site or pipeline, and by hand (Actions tab > Build and deploy > Run workflow).
# The downloads and parsed data (~1 GB) are cached between runs, so a normal run
# only fetches the last few days of JMA data; a run with an empty cache downloads
# everything and fits the forecast model (~30-40 min).
name: Build and deploy

on:
  schedule:
    - cron: "30 21 * * *" # 06:30 Japan time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "pipeline/**"
      - "run.sh"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy.yml"

permissions:
  contents: write # commit the forecast record back
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Restore downloaded and parsed data
        uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/interim
            site/public/tiles
            site/public/basemap-assets
            tools
          key: data-v1-${{ github.run_id }}
          restore-keys: data-v1-

      - name: Build data and site
        run: ./run.sh build

      # The prospective forecast record: each run's forecast, scored once its week is in the data.
      - name: Commit the forecast record
        run: |
          f=data/forecasts/issued.jsonl
          if [ -n "$(git status --porcelain -- "$f")" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "$f"
            git commit -m "Forecast record: $(date -u +%F)" -- "$f"
            git pull --rebase --autostash
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
