[project]
name = "quaketracker"
version = "0.1.0"
description = "Pipeline and static site visualising the JMA historical earthquake catalogue"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "numpy>=2.5.4",
    "pyarrow>=26.0.1",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
